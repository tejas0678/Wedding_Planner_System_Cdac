spring.application.name=chatbot-service
server.port=8083

# Main Wedding Planner backend - the ONLY upstream data source for this service.
# Chatbot-service must never talk to MySQL, repositories, or entities directly.
backend.base-url=http://localhost:8081
backend.timeout-ms=5000

# Groq API configuration (OpenAI-compatible Chat Completions schema).
# Credentials come from environment variables only - never hardcoded.
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.api-key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.timeout-ms=15000

# Allow the gateway/frontend origins to call this service directly during local dev.
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8082,https://wedding-planner-frontend.vercel.app

logging.level.com.cdac.chatbot=INFO
